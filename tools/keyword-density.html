<body>
<header><h1>📊 关键词密度分析器</h1></header>
<div class="container">
<textarea id="textInput" placeholder="在此粘贴网页文本内容，或手动输入...&#10;&#10;示例：我们的网站提供最好的SEO优化服务，包括关键词分析、标题优化、Meta描述优化等SEO工具。"></textarea>
<button class="btn" onclick="analyze()">🔍 分析关键词密度</button>
<div id="results" style="display:none">
<div class="stats" id="statsBar"></div>
<div class="panel">
<h3>📋 常用词统计（前20个）</h3>
<div class="filters">
<label style="color:#aaa;font-size:.85rem">过滤最少出现次数：</label>
<input type="number" id="minFreq" value="2" min="1" max="50" style="width:70px" onchange="showTopWords()">
</div>
<table class="freq-table"><thead><tr><th>关键词</th><th class="bar-cell">密度</th><th>频次</th><th>占比</th></tr></thead><tbody id="freqBody"></tbody></table>
</div>
<div class="panel">
<h3>💡 SEO建议</h3>

</div>
</div>

<script>
const STOP_WORDS=new Set('的了我是不在和就有都对就学生要以在为这主要上当地有过想中月从小大上来时候到做说需要对于这个年会被那么您去看多后还是以公司工作如何让时因为加入一个通过每天企业可以开主要管理中国用于联系提供服务这样其中这个网站了解市场为什么可以已经没有技术什么开发重要手机用户问题因为可以主要通过一下这个服务我们技术公司可以设计开发提供运营支持帮助专业团队为您打造优质解决方案品牌营销推广网站建设优化服务数据分析用户体验产品策划创新科技互联网数字转型智慧升级赋能助力前行共赢未来创造价值引领潮流追求卓越成就梦想持续改进精益求精专注品质用心服务客户至上信誉第一合作共赢携手并进共创辉煌展望未来无限可能';);
function analyze(){const text=document.getElementById('textInput').value.trim();if(!text){alert('请输入文本内容');return}
const words=countWords(text);const total=words.length;const unique=new Set(words).size;
document.getElementById('statsBar').innerHTML=`<div class="stat-card"><div class="num">${total}</div><div class="lbl">总字数</div></div><div class="stat-card"><div class="num">${unique}</div><div class="lbl">不同字词</div></div><div class="stat-card"><div class="num">${(total/unique).toFixed(1)}</div><div class="lbl">平均重复</div></div><div class="stat-card"><div class="num">${(total/300).toFixed(1)}%</div><div class="lbl">相对密度</div></div>`;
showTopWords();generateAdvice(words,total,unique)}
function countWords(text){let cleaned=text.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g,' ').replace(/\s+/g,' ').trim();const words=cleaned.split(' ').filter(w=>w.length>=1&&!(w.length<=2&&STOP_WORDS.has(w)));return words}
function showTopWords(){const words=countWords(document.getElementById('textInput').value.trim());if(!words.length)return;const freq={};words.forEach(w=>freq[w]=(freq[w]||0)+1);const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]);const minFreq=parseInt(document.getElementById('minFreq').value)||1;const filtered=sorted.filter(e=>e[1]>=minFreq);const total=words.length;const maxFreq=filtered[0]?filtered[0][1]:1;
document.getElementById('freqBody').innerHTML=filtered.slice(0,20).map(([w,c])=>{const pct=(c/total*100).toFixed(2);const barW=(c/maxFreq*100).toFixed(0);return`<tr><td>${escHtml(w)}</td><td class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${barW}%"></div></div></td><td>${c}</td><td>${pct}%</td></tr>`}).join('')}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function generateAdvice(words,total,unique){const freq={};words.forEach(w=>freq[w]=(freq[w]||0)+1);const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]);let html='';const top1=sorted[0]?sorted[0][1]/total*100:0;const top3=sorted.slice(0,3).reduce((s,e)=>s+e[1]/total*100,0);
if(top1>5){html+=`<div class="warn">⚠️ 最高频词密度 <strong>${top1.toFixed(1)}%</strong> 过高（建议≤3%），存在过度优化风险，请适当降低该词出现频率。</div>`}else if(top1>3){html+=`<div class="warn">⚠️ 最高频词密度 <strong>${top1.toFixed(1)}%</strong> 偏高，建议控制在3%以内。</div>`}else{html+=`<div class="ok">✅ 最高频词密度 <strong>${top1.toFixed(1)}%</strong> 在合理范围内（1%-3%为佳）。</div>`}
if(total<100){html+=`<div class="warn">⚠️ 文本内容较少（${total}字），建议至少300字以上以获得有意义的分析结果。</div>`}
if(sorted.length<5){html+=`<div class="warn">⚠️ 词汇多样性较低，建议丰富内容表达。</div>`}
html+=`<p style="color:#aaa;font-size:.85rem;margin-top:10px">💡 提示：中文关键词密度建议保持在 <strong style="color:#00d2ff">1%-3%</strong> 之间，英文内容建议 <strong style="color:#00d2ff">0.5%-2.5%</strong>。前3个高频词合计密度建议不超过 <strong style="color:#00d2ff">${top3.toFixed(1)}%</strong>（当前）。</p>`;
document.getElementById('adviceBox').innerHTML=html;
document.getElementById('results').style.display='block'}
</script>
